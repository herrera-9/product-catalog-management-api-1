name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-verify:
    name: Build & Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12.3"]

    env:
      MONGODB_URI: "mongodb://localhost:27017"
      MONGODB_DATABASE: "produtos"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile python files
        run: |
          python -m compileall .

      - name: Verify main module import
        run: |
          python -c "import main; print('main importado exitosamente')"

      - name: Verify FastAPI instance availability
        run: |
          python -c "from main import app; assert app.title == 'Catálogo de Productos API'; print('Instancia FastAPI validada')"
